<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobPulse - Resume Upload</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="centered-page">
  <main class="page">
    <a class="back-link" href="dashboard.html">&larr; Back to dashboard</a>
    <h1>Resume Upload</h1>
    <p class="page-subtitle">
      Upload a PDF resume (max 5MB). We'll pull out skills, education, and
      years of experience automatically using rule-based extraction.
    </p>

    <form id="resume-form" novalidate>
      <label for="resume_file">Resume (PDF)</label>
      <input type="file" id="resume_file" name="resume_file" accept="application/pdf" required />

      <button type="submit">Upload resume</button>
    </form>

    <p id="form-message" class="form-message" role="status"></p>
    <div id="parsed-results" class="parsed-results"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/resume-upload.js"></script>
</body>
</html>
