<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobPulse - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="app-page">
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-dot" aria-hidden="true"></span>
        JobPulse
      </a>
      <div class="topbar-actions">
        <a class="btn btn-secondary" href="preferences.html">Preferences</a>
        <a class="btn btn-secondary" href="resume-upload.html">Resume</a>
        <button class="btn btn-primary" id="refresh-button" type="button">Refresh jobs</button>
      </div>
    </header>

    <p id="fetch-summary" class="fetch-summary" role="status"></p>

    <section class="stats-row" aria-label="Job feed stats">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">-</div>
        <div class="stat-label">Total jobs</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-remote">-</div>
        <div class="stat-label">Remote</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-sources">-</div>
        <div class="stat-label">Sources</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-last-fetched">-</div>
        <div class="stat-label">Last fetched</div>
      </div>
    </section>

    <form class="filter-bar" id="filter-form">
      <input
        type="text"
        id="filter-search"
        class="filter-search"
        placeholder="Search title or company"
        aria-label="Search title or company"
      />
      <select id="filter-source" aria-label="Filter by source">
        <option value="">All sources</option>
        <option value="greenhouse">Greenhouse</option>
        <option value="lever">Lever</option>
        <option value="remotive">Remotive</option>
        <option value="arbeitnow">Arbeitnow</option>
      </select>
      <label class="filter-checkbox">
        <input type="checkbox" id="filter-remote" />
        Remote only
      </label>
      <span class="filter-count" id="filter-count"></span>
    </form>

    <main id="job-results">
      <div class="loading-state">Loading jobs...</div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
