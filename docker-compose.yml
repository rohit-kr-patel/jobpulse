services:
  db:
    image: postgres:16-alpine
    container_name: jobpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpulse}
      POSTGRES_DB: ${POSTGRES_DB:-jobpulse}
    ports:
      - "5432:5432"
    volumes:
      - jobpulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: jobpulse_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  jobpulse_pg_data:
